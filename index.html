<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kessler Syndrome Primer | Monolith Learning Systems</title>

<style>
:root{
  --navy:#1B1E3E;
  --blue:#1D3052;
  --deep:#2B4D6B;
  --steel:#37596E;
  --gold:#E3C170;
  --amber:#FAD493;
  --ink:#212529;
  --pale:#F3F5F7;
  --line:#CCD4DC;
  --review:#FFF5E3;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

body{
  margin:0;
  background:#E8EDF1;
  color:var(--ink);
  font:16px/1.48 "Funnel Sans","Segoe UI",Arial,sans-serif;
}

button,input,select,summary{font:inherit}

button{
  min-height:44px;
  padding:9px 14px;
  border:1px solid var(--steel);
  border-radius:5px;
  background:white;
  color:var(--blue);
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  color:#58616A;
  border-color:var(--line);
  background:var(--pale);
}

button.primary{
  background:var(--gold);
  color:var(--navy);
  border-color:var(--navy);
}

button.primary:disabled{
  background:var(--pale);
  color:#58616A;
  border-color:var(--line);
}

@media(hover:hover){
  button:hover:not(:disabled),
  summary:hover{
    background:var(--review);
  }

  button.primary:hover:not(:disabled){
    background:var(--gold);
    box-shadow:inset 0 0 0 2px var(--navy);
  }
}

:focus-visible{
  outline:3px solid var(--deep);
  outline-offset:3px;
}

h1,h2,h3,h4,p,figure{
  margin:0 0 12px;
}

h1{
  color:var(--navy);
  font-size:1.65rem;
  line-height:1.2;
}

h2{
  color:var(--blue);
  font-size:1.15rem;
}

h3,h4{
  color:var(--blue);
  font-size:1rem;
}

p:last-child{margin-bottom:0}
.small{font-size:.88rem}

.sr-only,
.skip:not(:focus){
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.skip:focus{
  position:fixed;
  top:8px;
  left:8px;
  z-index:30;
  padding:12px;
  background:white;
}

.player{
  width:min(
    calc(100vw - 24px),
    1440px,
    calc((100dvh - 24px)*16/9)
  );
  aspect-ratio:16/9;
  max-height:calc(100dvh - 24px);
  margin:12px auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:white;
  border:1px solid var(--navy);
  border-radius:8px;
  box-shadow:0 10px 35px #1B1E3E20;
}

.player.reading{
  width:min(calc(100vw - 24px),1440px);
  height:calc(100dvh - 24px);
  aspect-ratio:auto;
}

.topbar{
  flex:none;
  display:flex;
  gap:12px;
  align-items:center;
  padding:6px 14px;
  color:white;
  background:var(--navy);
}

.topbar button{
  font-size:.85rem;
  background:transparent;
  color:white;
  border-color:#AEB8C9;
}

.topbar button:hover:not(:disabled){
  color:var(--navy);
  background:var(--amber);
}

.topbar button:disabled{
  color:#BFC7D3;
  border-color:#65738A;
}

.topbar :focus-visible,
.menu :focus-visible{
  outline-color:var(--amber);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-right:auto;
  min-width:0;
}

.brand small{
  display:block;
  font-size:.68rem;
  letter-spacing:.04em;
  color:var(--amber);
}

.brand strong{
  display:block;
  font-size:1rem;
}

.logo-wrap{
  --mark:28px;
  display:inline-flex;
  flex:none;
  padding:calc(var(--mark)/2);
  background:white;
  border-radius:3px;
}

.logo-wrap img{
  height:var(--mark);
  width:auto;
  display:block;
}

.tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.workspace{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
}

.menu{
  flex:0 0 215px;
  padding:14px 8px;
  background:var(--blue);
  color:white;
  overflow:auto;
}

.menu h2{
  color:white;
  font-size:1rem;
  margin:0 10px 14px;
}

.menu-group{
  margin-bottom:5px;
}

.menu-heading{
  width:100%;
  text-align:left;
  display:flex;
  justify-content:space-between;
  gap:8px;
  border:0;
  min-height:40px;
  padding:10px;
  font-size:.84rem;
  color:var(--amber);
  background:transparent;
}

.menu-heading:hover:not(:disabled){
  background:var(--deep);
}

.menu ol{
  list-style:none;
  margin:0;
  padding:0 0 5px;
}

.menu-item{
  display:flex;
  align-items:flex-start;
  gap:7px;
  width:100%;
  text-align:left;
  min-height:38px;
  padding:8px 10px;
  margin:2px 0;
  border:1px solid transparent;
  color:white;
  background:transparent;
  font-size:.81rem;
  line-height:1.35;
  font-weight:400;
}

.menu-item:disabled{
  color:#BEC9D7;
  background:transparent;
  border-color:transparent;
}

.menu-item:hover:not(:disabled){
  background:var(--deep);
  color:white;
}

.menu-item[aria-current="page"]{
  color:var(--navy);
  background:var(--amber);
  font-weight:700;
}

.menu .mark{
  flex:0 0 13px;
}

.menu-collapsed .menu{
  display:none;
}

.canvas{
  flex:1;
  min-width:0;
  min-height:0;
  overflow:auto;
  padding:22px 25px;
  scroll-padding:20px;
}

.canvas.welcome{
  background:var(--amber);
}

.canvas [tabindex="-1"]:focus{
  outline:none;
}

.screen-body{
  margin-top:18px;
}

.two,
.objectives{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  border:1px solid var(--line);
  border-radius:6px;
  padding:17px 19px;
  margin-bottom:16px;
  background:white;
}

.objectives{
  list-style:none;
  margin:0;
  padding:0;
  gap:12px;
}

.objectives .card{
  margin:0;
}

.objectives h3{
  margin-bottom:5px;
}

.goal{
  color:white;
  background:var(--navy);
}

.goal h2{
  color:var(--amber);
}

.guide{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:17px;
}

.guide p{
  margin:0;
}

.guide-label{
  color:var(--steel);
  font-size:.76rem;
  font-weight:700;
  margin-bottom:3px;
}

.avatar{
  position:relative;
  width:47px;
  height:47px;
  flex:none;
  overflow:hidden;
  border-radius:50%;
  border:2px solid var(--gold);
  background:var(--blue);
}

.avatar::before{
  content:"";
  position:absolute;
  top:5px;
  left:13px;
  width:17px;
  height:20px;
  border-radius:45%;
  background:var(--amber);
}

.avatar::after{
  content:"";
  position:absolute;
  left:4px;
  top:27px;
  width:35px;
  height:25px;
  border-radius:50% 50% 0 0;
  background:var(--steel);
  border:2px solid var(--amber);
}

.mission-feedback{
  display:flex;
  gap:14px;
  align-items:flex-start;
  margin:0 0 18px;
  padding:15px 17px;
  border:1px solid #D8C47F;
  border-left:5px solid var(--gold);
  border-radius:6px;
  background:var(--review);
}

.mission-feedback .guide-label{
  color:var(--blue);
  margin-bottom:3px;
}

.mission-feedback h3{
  margin:0 0 5px;
  color:var(--navy);
  font-size:1.05rem;
}

.mission-feedback p{
  margin:0;
}

.mission-feedback .mission-evidence{
  margin-top:7px;
}

.callout{
  margin:15px 0;
  padding:13px 16px;
  border-left:4px solid var(--gold);
  background:var(--pale);
}

.session-notice{
  margin:15px 0;
  padding:11px 14px;
  border:1px solid var(--line);
  border-left:4px solid var(--steel);
  border-radius:5px;
  background:var(--pale);
  color:var(--ink);
  font-size:.88rem;
}

.session-notice strong{
  color:var(--blue);
}

.decision-checklist{
  border-left:4px solid var(--gold);
}

.decision-checklist .check-item{
  padding:8px 0;
}

.decision-checklist .check-item + .check-item{
  border-top:1px solid var(--line);
}

.decision-checklist h3{
  margin:0 0 3px;
}

.branches{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.branch-card{
  display:flex;
  flex-direction:column;
  padding:18px;
  border:1px solid var(--line);
  border-top:4px solid var(--deep);
  border-radius:6px;
}

.branch-card h2{
  margin-top:10px;
}

.branch-card button{
  margin-top:auto;
}

.status{
  font-size:.85rem;
  color:var(--steel);
  font-weight:600;
}

.hub-summary{
  margin:17px 0 6px;
}

.flow{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
  list-style:none;
  padding:0;
  margin:18px 0 12px;
}

.flow li{
  position:relative;
  background:var(--pale);
  border-radius:6px;
  padding:15px;
}

.flow li:not(:last-child)::after{
  content:"→";
  position:absolute;
  right:-21px;
  top:40%;
  color:var(--deep);
  font-size:1.35rem;
}

.flow h2{
  margin-top:12px;
}

.art-frame{
  aspect-ratio:16/9;
  background:white;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
  position:relative;
}

.art-frame img,
.art-frame svg{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

.art-placeholder{
  height:100%;
  position:relative;
}

.placeholder-label{
  position:absolute;
  top:5px;
  left:7px;
  padding:2px 6px;
  background:white;
  color:var(--steel);
  font-size:.7rem;
  border:1px solid var(--line);
  border-radius:3px;
}

.diagram-note{
  color:var(--steel);
  font-size:.88rem;
}

.decision-layout{
  display:grid;
  grid-template-columns:minmax(250px,.85fr) minmax(0,1.4fr);
  gap:22px;
  align-items:start;
}

.report{
  border:1px solid var(--line);
  border-radius:7px;
  overflow:hidden;
  background:white;
  min-width:0;
}

.report-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:13px 16px;
  color:white;
  background:var(--deep);
}

.report-label{
  font-size:.8rem;
  color:var(--amber);
  margin:0 0 4px;
  font-weight:600;
}

.report-title{
  font-size:1.03rem;
  color:white;
  margin:0;
}

.report-meta{
  font-size:.85rem;
  margin:3px 0 0;
}

.report-clock{
  flex:none;
  border:1px solid #FFFFFF80;
  border-radius:4px;
  padding:6px 10px;
  text-align:center;
}

.report-clock span{
  display:block;
  font-size:.75rem;
}

.report-clock strong{
  display:block;
  color:var(--amber);
  font-variant-numeric:tabular-nums;
}

.report-fields{
  margin:0;
  padding:0;
}

.report-row{
  padding:10px 16px;
  border-bottom:1px solid var(--line);
}

.report-row:nth-child(even){
  background:var(--pale);
}

.report-row:last-child{
  border-bottom:0;
}

.report-row dt{
  font-size:.86rem;
  font-weight:700;
  color:var(--steel);
  margin-bottom:3px;
}

.report-row dd{
  font-size:.94rem;
  margin:0;
}

.report-row.cued{
  border-left:4px solid var(--gold);
  padding-left:12px;
  background:var(--review);
}

.report-footer,
.report-note{
  padding:10px 16px;
  border-top:1px solid var(--line);
}

.report-footer button{
  min-height:38px;
  padding:6px 10px;
  font-size:.85rem;
}

.report-note p{
  font-size:.92rem;
}

.report--expanded .report-row{
  display:grid;
  grid-template-columns:140px minmax(0,1fr);
  gap:15px;
  padding:12px 16px;
  align-items:baseline;
}

.report--expanded .report-row dt{
  margin:0;
}

.evidence-strip{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:12px 0;
}

.evidence-strip div{
  flex:1 1 130px;
  padding:10px 12px;
  border-left:3px solid var(--gold);
  background:var(--pale);
}

.evidence-strip strong{
  display:block;
  color:var(--blue);
  font-variant-numeric:tabular-nums;
}

.evidence-strip span{
  display:block;
  font-size:.87rem;
}

fieldset{
  border:0;
  padding:0;
  margin:0 0 15px;
  min-width:0;
}

legend{
  width:100%;
  padding:0 0 9px;
  font-weight:600;
  color:var(--blue);
}

.choice{
  display:flex;
  gap:10px;
  align-items:flex-start;
  border:1px solid var(--line);
  border-radius:5px;
  padding:11px 13px;
  margin:8px 0;
  cursor:pointer;
}

.choice:hover{
  border-color:var(--deep);
}

.choice:has(input:checked){
  border-color:var(--deep);
  box-shadow:inset 0 0 0 1px var(--deep);
  background:var(--pale);
}

.choice input{
  width:18px;
  height:18px;
  flex:none;
  margin:3px 0 0;
  accent-color:var(--blue);
}

.choice span{
  font-size:.95rem;
}

.choice strong{
  color:var(--blue);
}

.pair-steps{
  display:flex;
  gap:8px;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.pair-steps button{
  font-size:.87rem;
  padding:7px 11px;
}

.pair-steps button[aria-pressed="true"]{
  background:var(--blue);
  color:white;
}

.selected{
  padding:12px 14px;
  margin-bottom:14px;
  border-radius:5px;
  background:var(--pale);
  font-size:.94rem;
}

.selected strong{
  color:var(--blue);
}

.feedback{
  border-left:4px solid var(--deep);
  background:var(--pale);
  padding:15px 17px;
  margin:14px 0;
}

.feedback.needs{
  border-color:var(--gold);
}

.response-card,
.decision-result{
  border-top:4px solid var(--deep);
}

.feedback-part + .feedback-part{
  border-top:1px solid var(--line);
  margin-top:13px;
  padding-top:13px;
}

.feedback-part h3{
  margin-bottom:6px;
}

.verdict{
  display:inline-block;
  font-size:.86rem;
  font-weight:600;
  padding:4px 9px;
  margin:0 0 10px;
  border:1px solid var(--steel);
  border-radius:4px;
  color:var(--blue);
  background:var(--pale);
}

.verdict.review{
  color:var(--ink);
  border-color:var(--gold);
  background:var(--review);
}

.match-row{
  display:block;
  margin-bottom:18px;
}

.match-row span{
  display:block;
  color:var(--blue);
  font-weight:600;
  margin-bottom:7px;
}

select{
  width:100%;
  min-height:44px;
  border:1px solid var(--steel);
  border-radius:4px;
  padding:8px;
  background:white;
  color:var(--ink);
}

.assessment-label{
  margin:0 0 15px;
  padding:9px 12px;
  color:var(--blue);
  background:var(--pale);
  border-left:4px solid var(--deep);
  font-size:.91rem;
}

.score-map{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin:14px 0;
}

.score-map div{
  padding:10px;
  background:var(--pale);
  border:1px solid var(--line);
  border-radius:5px;
  font-size:.85rem;
}

.score-map strong,
.score-map span{
  display:block;
}

.score-map .two-points{
  border:2px solid var(--deep);
}

.results-summary{
  display:flex;
  gap:18px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.score{
  display:block;
  color:var(--navy);
  font-size:1.65rem;
  font-weight:700;
}

.review-nav{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:12px 0 18px;
}

.review-nav button{
  text-align:left;
  padding:10px 12px;
  border-color:var(--line);
}

.review-nav button[aria-current="page"]{
  border:2px solid var(--deep);
  padding:9px 11px;
  background:var(--pale);
}

.review-nav strong,
.review-nav span{
  display:block;
}

.review-nav span{
  font-size:.82rem;
  font-weight:400;
  margin-top:3px;
}

.review-stage{
  font-size:.85rem;
  color:var(--steel);
  font-weight:700;
  margin-bottom:8px;
}

.practice{
  border:2px solid var(--deep);
  padding:17px;
  border-radius:6px;
  margin:0 0 16px;
  background:white;
}

.practice-launch{
  border-left:4px solid var(--gold);
  background:var(--review);
  padding:15px 17px;
  margin-top:16px;
}

.practice-launch h3{
  margin-bottom:7px;
}

.practice .feedback{
  margin-bottom:0;
}

.practice-top{
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.practice-top p{
  margin:0;
}

.practice-note{
  font-size:.88rem;
  color:var(--steel);
}

.practice-actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:14px;
}

.optional-details{
  margin:12px 0;
  border-top:1px solid var(--line);
}

.optional-details summary{
  cursor:pointer;
  min-height:44px;
  padding:10px 4px;
  color:var(--blue);
  font-weight:600;
}

.optional-details div{
  padding:8px 4px;
}

.media-block{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(210px,1fr);
  gap:8px 14px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:16px;
  background:white;
}

.media-block h2{
  font-size:1rem;
  margin:0;
}

.media-block .optional-details,
.media-block .audio-caption,
.media-block .media-error,
.media-block .embedded-visual{
  grid-column:1/-1;
}

.media-block .optional-details{
  margin:0;
}

.media-block audio{
  display:block;
  width:100%;
  min-width:0;
}

.caption-toggle{
  font-size:.85rem;
  justify-self:start;
}

.caption-toggle[aria-pressed="true"]{
  background:var(--blue);
  color:white;
}

.audio-caption{
  padding:14px 20px;
  min-height:3.8em;
  background:var(--navy);
  color:white;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:1.12rem;
  line-height:1.5;
  font-weight:500;
}

.audio-caption span{
  max-width:70ch;
}

.concept-media .audio-caption{
  margin-bottom:2px;
}

.concept-media .embedded-visual{
  margin:0;
}

.concept-media .flow{
  margin:4px 0 10px;
}

.media-error{
  font-size:.9rem;
  color:var(--steel);
}

.certificate{
  border:3px double var(--deep);
  padding:20px 28px;
  text-align:center;
  background:white;
}

.certificate .logo-wrap{
  --mark:40px;
}

.certificate h2{
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:1.4rem;
}

.certificate h3{
  font-size:1.55rem;
  margin:16px 0;
}

.certificate .recipient{
  font-size:1.3rem;
  padding:10px 0;
  overflow-wrap:anywhere;
}

.certificate .qualifier{
  border-top:1px solid var(--line);
  padding-top:14px;
  margin-top:20px;
  font-size:.9rem;
}

.name-field{
  display:block;
  margin:16px 0;
}

.name-field input{
  display:block;
  width:min(100%,440px);
  padding:10px;
  margin-top:6px;
  border:1px solid var(--steel);
  border-radius:4px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:16px 0;
}

.playerbar{
  flex:none;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:18px;
  padding:11px 16px;
  border-top:1px solid var(--line);
  background:var(--pale);
}

.progress-line{
  display:flex;
  gap:12px;
  justify-content:space-between;
  flex-wrap:wrap;
  font-size:.8rem;
  color:var(--steel);
}

progress{
  display:block;
  width:100%;
  height:7px;
  margin-top:6px;
  accent-color:var(--deep);
  border:0;
}

progress::-webkit-progress-bar{
  background:var(--line);
  border-radius:7px;
}

progress::-webkit-progress-value{
  background:var(--deep);
  border-radius:7px;
}

progress::-moz-progress-bar{
  background:var(--deep);
  border-radius:7px;
}

#actionHint{
  font-size:.8rem;
  color:var(--steel);
  margin-top:5px;
}

dialog{
  width:min(800px,calc(100% - 28px));
  max-height:85dvh;
  padding:0;
  border:2px solid var(--navy);
  border-radius:7px;
  color:var(--ink);
}

dialog::backdrop{
  background:#1B1E3EA8;
}

.dialog-head{
  position:sticky;
  top:0;
  display:flex;
  gap:16px;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px;
  background:var(--navy);
  z-index:1;
}

.dialog-head h2{
  color:white;
  margin:0;
}

.dialog-head :focus-visible{
  outline-color:var(--amber);
}

.dialog-body{
  padding:18px;
  white-space:normal;
  overflow-wrap:anywhere;
}

.screen-text{
  white-space:pre-line;
}

.print-only{
  display:none;
}

@media(max-width:1100px){
  .menu{flex-basis:190px}
  .canvas{padding:18px}

  .decision-layout{
    gap:16px;
    grid-template-columns:minmax(220px,.8fr) minmax(0,1.2fr);
  }

  .topbar{gap:8px}
  .brand strong{font-size:.91rem}
  .tools{gap:5px}
  .tools button{padding:8px 10px}
}

@media(max-width:900px){
  .topbar{flex-wrap:wrap}

  .tools{
    justify-content:flex-end;
    width:100%;
    padding-bottom:4px;
  }

  .brand{flex:1}
  .workspace{flex-direction:column}

  .menu{
    flex:0 0 auto;
    width:100%;
    max-height:40%;
  }

  .two,
  .objectives,
  .decision-layout,
  .branches,
  .flow{
    grid-template-columns:1fr;
  }

  .flow{gap:20px}

  .flow li:not(:last-child)::after{
    content:"↓";
    right:50%;
    top:auto;
    bottom:-25px;
  }

  .playerbar{
    gap:9px;
    padding:10px;
    grid-template-columns:auto 1fr;
  }

  .progress-group{
    grid-column:1/-1;
    grid-row:2;
  }

  #nextButton{justify-self:end}
  h1{font-size:1.4rem}

  .concept-media .audio-caption{
    position:sticky;
    top:0;
    z-index:2;
    box-shadow:0 3px 10px #1B1E3E28;
  }
}

@media(max-width:540px){
  .player,
  .player.reading{
    margin:6px auto;
    width:calc(100vw - 12px);
    height:calc(100dvh - 12px);
    max-height:calc(100dvh - 12px);
    aspect-ratio:auto;
  }

  .canvas{padding:16px}

  .review-nav,
  .score-map{
    grid-template-columns:1fr 1fr;
  }

  .media-block{
    grid-template-columns:1fr;
  }

  .report--expanded .report-row{
    grid-template-columns:1fr;
    gap:3px;
  }

  .dialog-body{padding:12px}
}

@media(max-height:500px) and (orientation:landscape){
  .player,
  .player.reading{
    margin:4px auto;
    width:calc(100vw - 8px);
    height:calc(100dvh - 8px);
    max-height:calc(100dvh - 8px);
    aspect-ratio:auto;
  }

  .topbar{
    flex-wrap:nowrap;
    gap:6px;
    padding:4px 8px;
  }

  .brand{
    gap:7px;
  }

  .brand small{
    display:none;
  }

  .brand strong{
    font-size:.82rem;
    white-space:nowrap;
  }

  .logo-wrap{
    --mark:18px;
    padding:6px;
  }

  .tools{
    width:auto;
    flex-wrap:nowrap;
    gap:4px;
    padding:0;
  }

  .tools button,
  .topbar > button{
    min-height:34px;
    padding:4px 8px;
    font-size:.72rem;
  }

  .canvas{
    padding:10px 14px;
  }

  .screen-body{
    margin-top:10px;
  }

  h1{
    margin-bottom:8px;
    font-size:1.25rem;
  }

  .playerbar{
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:8px;
    padding:5px 8px;
  }

  .progress-group{
    grid-column:auto;
    grid-row:auto;
  }

  .progress-line{
    flex-wrap:nowrap;
    font-size:.72rem;
  }

  #progressLabel{
    display:none;
  }

  progress{
    height:5px;
    margin-top:3px;
  }

  #actionHint{
    margin-top:1px;
    font-size:.7rem;
    line-height:1.2;
  }

  .playerbar button{
    min-height:34px;
    padding:4px 10px;
    font-size:.78rem;
  }
}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
}

@media print{
  @page{size:landscape;margin:18mm}
  body{background:white}
  body>*{display:none!important}
  #printSheet{display:block!important}
  .certificate{border-color:black}
}

function canVisit(id){

  if(!screen(id))return false;

  if(examLocked()){
    return id===(EXAM[state.examIndex]||"results");
  }

  if(id==="intro")return true;
  if(id==="concept")return state.done.has("intro");
  if(id==="model")return state.done.has("concept");
  if(id==="hub")return state.done.has("model");

  const b=branchFor(id);

  if(b){

    if(!state.done.has("model")||!state.hubSeen){
      return false;
    }

    const i=b.pages.indexOf(id);

    return i===0||
      state.done.has(b.pages[i-1]);
  }

  if(id==="debrief"){
    return allBranchesDone();
  }

  if(EXAM.includes(id)){
    return !state.examStarted&&
      id==="s1"&&
      state.done.has("debrief");
  }

  if(id==="results"){
    return allAnswered()&&
      state.examIndex===4;
  }

  if(id==="finish"){
    return allBranchesDone()&&
      reviewComplete()&&
      state.done.has("results");
  }

  return false;
}

function go(id,push=true){

  if(!canVisit(id)){
    announce(
      "Complete the current activity before opening that screen."
    );
    return;
  }

  captureDraft();

  if(id==="s1"&&!state.examStarted){
    state.examStarted=true;
    state.examIndex=0;
  }

  if(id!==state.page&&push){
    state.history.push(state.page);
  }

  if(id==="hub"){
    state.hubSeen=true;
  }

  if(branchFor(id)){
    state.done.add("hub");
  }

  state.page=id;
  state.openGroup=screen(id).group;

  if(innerWidth<=900){
    setMenu(false);
  }

  render();
}

function previousPage(){

  for(let i=state.history.length-1;i>=0;i--){

    const id=state.history[i];

    if(
      id!==state.page&&
      canVisit(id)
    ){
      return {id,index:i};
    }
  }

  return null;
}

function back(){

  const q=QUESTIONS[state.page];
  const r=state.answers[state.page];

  if(
    q?.type==="pair"&&
    !r.submitted&&
    r.phase===1
  ){
    captureDraft();
    r.phase=0;
    render("questionTitle");
    return;
  }

  if(state.page==="results"){

    if(state.reviewPanel>0){
      selectReview(state.reviewPanel-1);
    }

    return;
  }

  const prev=previousPage();

  if(prev){
    state.history.length=prev.index;
    go(prev.id,false);
  }
}

function startBranch(id){

  const b=BRANCHES.find(
    b=>b.id===id
  );

  if(
    b&&
    state.hubSeen&&
    !examLocked()
  ){
    go(
      b.pages.find(
        id=>!state.done.has(id)
      )||
      b.pages[0]
    );
  }
}

    const anchor=id==="practiceTitle"
      ?el.closest(".practice")

    const a=anchor.getBoundingClientRect();

      id==="practiceTitle"||

      a.top<b.top||
      a.bottom>b.bottom

function mountMedia(){

  document
    .querySelectorAll("[data-media]")
    .forEach(el=>{

      const key=el.dataset.media;
      const m=MEDIA[key];

      const block=el.closest(
        "[data-media-block]"
      );

      const cues=m.cues.filter(c=>
        Number.isFinite(c.start)&&
        Number.isFinite(c.end)&&
        c.start>=0&&
        c.end>c.start&&
        typeof c.text==="string"
      );

      const caption=
        block.querySelector(
          "[data-caption]"
        );

      const region=
        caption.parentElement;

      const toggle=
        block.querySelector(
          ".caption-toggle"
        );

      let frame=0;

      const syncCaption=()=>{

        region.hidden=
          !state.captions;

        const cue=
          cues.find(
            c=>
              el.currentTime>=c.start&&
              el.currentTime<c.end
          );

        let text=
          cue?.text||"";

        if(
          !text&&
          (
            el.currentTime<0.15||
            el.ended
          )
        ){
          text=
            "Captions appear here during playback.";
        }

        if(
          caption.textContent!==text
        ){
          caption.textContent=text;
        }
      };

      const updateToggle=()=>{

        toggle.setAttribute(
          "aria-pressed",
          String(state.captions)
        );

        toggle.textContent=
          `Captions: ${state.captions?"On":"Off"}`;
      };

      const tick=()=>{

        syncCaption();

        if(
          !el.paused&&
          !el.ended&&
          el.isConnected
        ){
          frame=
            requestAnimationFrame(
              tick
            );
        }
      };

      el.addEventListener(
        "loadedmetadata",
        ()=>{

          const saved=
            state.mediaTimes[key];

          if(
            Number.isFinite(saved)&&
            saved>0&&
            saved<el.duration
          ){
            try{
              el.currentTime=saved;
            }catch(error){
              /* Transcript remains available. */
            }
          }

          syncCaption();
        }
      );

      [
        "timeupdate",
        "seeked",
        "ended"
      ].forEach(event=>{

        el.addEventListener(
          event,
          syncCaption
        );
      });

      el.addEventListener(
        "play",
        ()=>{

          document
            .querySelectorAll(
              "[data-media]"
            )
            .forEach(other=>{

              if(other!==el){
                other.pause();
              }
            });

          cancelAnimationFrame(frame);
          tick();
        }
      );

      el.addEventListener(
        "pause",
        ()=>{

          cancelAnimationFrame(frame);
          syncCaption();
        }
      );

      toggle.addEventListener(
        "click",
        ()=>{

          state.captions=
            !state.captions;

          updateToggle();
          syncCaption();
        }
      );

      el.addEventListener(
        "error",
        ()=>{

          cancelAnimationFrame(frame);

          block
            .querySelector(
              "[data-media-error]"
            )
            .hidden=false;

          toggle.hidden=true;
          region.hidden=true;
        }
      );

      el.src=
        assetPath(m.src);

      updateToggle();
      syncCaption();
    });

  document
    .querySelectorAll("img[data-art]")
    .forEach(img=>{

      img.addEventListener(
        "load",
        ()=>{

          img.hidden=false;

          img.parentElement
            .querySelector(
              ".art-placeholder"
            )
            .hidden=true;
        }
      );

      img.addEventListener(
        "error",
        ()=>{

          img.hidden=true;

          img.parentElement
            .querySelector(
              ".art-placeholder"
            )
            .hidden=false;
        }
      );

      img.src=
        assetPath(
          ART[
            Number(img.dataset.art)
          ].src
        );
    });
}

function choices(
  name,
  title,
  options,
  value,
  multiple=false,
  headingId="questionTitle"
){

  const selected=
    Array.isArray(value)
      ?value
      :[value];

  return `
    <fieldset>

      <legend
        id="${headingId}"
        tabindex="-1"
      >
        ${esc(title)}
      </legend>

      ${
        options
          .map(
            ([id,text])=>`
              <label class="choice">

                <input
                  type="${multiple?"checkbox":"radio"}"
                  name="${name}"
                  value="${id}"
                  ${selected.includes(id)?"checked":""}
                >

                <span>
                  <strong>${id}.</strong>
                  ${esc(text)}
                </span>

              </label>
            `
          )
          .join("")
      }

    </fieldset>
  `;
}

function knowledgeFeedback(q,r){

  const d=r.original;

  if(q.type==="match"){

    const count=
      q.key.filter(
        (k,i)=>
          k===d["row"+i]
      ).length;

    return `
      <section class="feedback ${count<3?"needs":""}">

        <h2 id="answerTitle" tabindex="-1">
          ${count} of 3 matches correct
        </h2>

        ${
          q.rows
            .map(
              (row,i)=>`
                <section class="feedback-part">

                  <h3>
                    ${i+1}. ${esc(row)}
                  </h3>

                  ${
                    d["row"+i]===q.key[i]
                      ?`
                        <p>
                          <strong>Correct.</strong>
                          ${esc(q.rowWhy[i])}
                        </p>
                      `
                      :`
                        <p>
                          <strong>Your match:</strong>
                          ${esc(choiceText(q.effects,d["row"+i]))}
                        </p>

                        <p>
                          <strong>Correct match:</strong>
                          ${esc(choiceText(q.effects,q.key[i]))}
                        </p>

                        ${p(q.rowWhy[i])}
                      `
                  }

                </section>
              `
            )
            .join("")
        }

      </section>
    `;
  }

  return `
    <section class="feedback ${r.feedback<2?"needs":""}">

      <h2 id="answerTitle" tabindex="-1">
        ${
          r.feedback===2
            ?"Correct"
            :r.feedback===1
              ?"Partly correct"
              :"Reconsider the evidence"
        }
      </h2>

      ${p(q.feedback[r.feedback])}

      ${
        r.feedback===2
          ?""
          :p(q.explanation)
      }

    </section>
  `;
}

function requiredForPanel(i){

  return QUESTIONS[
    EXAM[i]
  ].slots.filter(
    s=>state.scores[s]===0
  );
}

function pendingForPanel(i){

  return requiredForPanel(i)
    .filter(
      s=>!state.practice[s].passed
    );
}

function reviewReady(i){

  return allAnswered()&&
    state.reviewSeen.has(i)&&
    pendingForPanel(i).length===0;
}

function reviewLabel(){

  return state.reviewPanel===3
    ?"Finish review"
    :"Next review";
}

function recordCurrentReview(){

  if(
    state.page==="results"&&
    reviewReady(
      state.reviewPanel
    )
  ){
    state.reviewed.add(
      state.reviewPanel
    );
  }
}

function activePracticeSlot(){

  const i=
    state.reviewPanel;

  const required=
    requiredForPanel(i);

  if(!required.length){
    return null;
  }

  if(
    !required.includes(
      state.practiceCursor[i]
    )
  ){
    state.practiceCursor[i]=
      pendingForPanel(i)[0]??
      required[
        required.length-1
      ];
  }

  return state.practiceCursor[i];
}

function selectReview(i){

  if(
    state.page!=="results"||
    !allAnswered()||
    !Number.isInteger(i)||
    i<0||
    i>3
  ){
    return;
  }

  if(
    i!==state.reviewPanel
  ){
    recordCurrentReview();
  }

  state.reviewPanel=i;
  state.practiceVisible[i]=false;

  render("reviewTitle");
}

function startPractice(){

  if(
    state.page!=="results"||
    !allAnswered()||
    !state.reviewSeen.has(
      state.reviewPanel
    )
  ){
    return;
  }

  const next=
    pendingForPanel(
      state.reviewPanel
    )[0];

  if(next===undefined){
    return;
  }

  state.practiceCursor[
    state.reviewPanel
  ]=next;

  state.practiceVisible[
    state.reviewPanel
  ]=true;

  render("practiceTitle");
}

function practiceReady(){

  if(
    state.page!=="results"||
    !state.practiceVisible[
      state.reviewPanel
    ]
  ){
    return false;
  }

  const slot=
    activePracticeSlot();

  if(slot===null){
    return false;
  }

  const r=
    state.practice[slot];

  return !r.passed&&
    r.choice!==r.last&&
    FOLLOWUP[
      slot
    ].choices.some(
      ([id])=>id===r.choice
    );
}

function submitPractice(){

  if(
    !allAnswered()||
    !practiceReady()
  ){
    return;
  }

  const slot=
    activePracticeSlot();

  const r=
    state.practice[slot];

  r.last=
    r.choice;

  r.attempts++;

  r.passed=
    r.choice===
    FOLLOWUP[slot].key;

  render(
    "practiceFeedback"
  );

  announce(
    r.passed
      ?"Practice question complete. Your original assessment score has not changed."
      :"Read the guidance, choose another answer, and select Check answer."
  );
}

function nextPractice(){

  if(
    state.page!=="results"||
    !state.practiceVisible[
      state.reviewPanel
    ]
  ){
    return;
  }

  const current=
    activePracticeSlot();

  if(
    current===null||
    !state.practice[
      current
    ].passed
  ){
    return;
  }

  const next=
    pendingForPanel(
      state.reviewPanel
    )[0];

  if(next!==undefined){

    state.practiceCursor[
      state.reviewPanel
    ]=next;

    render("practiceTitle");
  }
}

function advanceReview(){

  const i=
    state.reviewPanel;

  if(
    state.page!=="results"||
    !reviewReady(i)
  ){
    return;
  }

  if(i<3){

    recordCurrentReview();

    selectReview(
      i+1
    );

    return;
  }

  if(
    [0,1,2].some(
      j=>!state.reviewed.has(j)
    )
  ){
    return;
  }

  recordCurrentReview();

  if(reviewComplete()){

    state.done.add(
      "results"
    );

    go(
      "finish"
    );
  }
}

function content(id){

  if(QUESTIONS[id]){
    return questionPage(id);
  }

  const templates={
    intro:welcome,
    concept,
    model:modeledExample,
    hub,
    debrief,
    results:resultsPage,
    finish:finishPage
  };

  return templates[id]
    ?templates[id]()
    :consequence(id);
}

function captureDraft(){

  const q=
    QUESTIONS[
      state.page
    ];

  const r=
    state.answers[
      state.page
    ];

  const form=
    $("responseForm");

  if(
    !q||
    r.submitted||
    !form
  ){
    return;
  }

  const data=
    new FormData(form);

  if(q.type==="pair"){

    const field=
      r.phase===0
        ?"action"
        :"reason";

    r.draft[field]=
      data.get(field);

  }else if(q.type==="multi"){

    r.draft.selected=
      data.getAll("choice");

  }else if(q.type==="match"){

    q.rows.forEach(
      (_,i)=>{

        r.draft[
          "row"+i
        ]=
          data.get(
            "row"+i
          );
      }
    );

  }else{

    r.draft.choice=
      data.get("choice");
  }
}

function valid(q,d){

  const has=
    (options,value)=>
      options.some(
        ([id])=>id===value
      );

  if(q.type==="pair"){

    return has(
      q.actions,
      d.action
    )&&
    has(
      q.reasons,
      d.reason
    );
  }

  if(q.type==="multi"){

    return Array.isArray(
      d.selected
    )&&
    d.selected.length===2&&
    new Set(
      d.selected
    ).size===2&&
    d.selected.every(
      v=>
        has(
          q.choices,
          v
        )
    );
  }

  if(q.type==="match"){

    return q.rows.every(
      (_,i)=>
        has(
          q.effects,
          d["row"+i]
        )
    );
  }

  return has(
    q.choices,
    d.choice
  );
}

function freezeResponse(d){

  const response=
    JSON.parse(
      JSON.stringify(d)
    );

  if(
    Array.isArray(
      response.selected
    )
  ){
    Object.freeze(
      response.selected
    );
  }

  return Object.freeze(
    response
  );
}

function submitAnswer(){

  const id=
    state.page;

  const q=
    QUESTIONS[id];

  const r=
    state.answers[id];

  if(
    !q||
    r.submitted||
    !canVisit(id)
  ){
    return;
  }

  if(
    q.exam&&
    id!==EXAM[
      state.examIndex
    ]
  ){
    return;
  }

  captureDraft();

  if(
    !valid(
      q,
      r.draft
    )
  ){
    return;
  }

  const d=
    r.original=
      freezeResponse(
        r.draft
      );

  r.submitted=true;

  if(q.exam){

    if(q.type==="pair"){

      state.scores[
        q.slots[0]
      ]=
        Number(
          d.action===
          q.keyAction
        );

      state.scores[
        q.slots[1]
      ]=
        Number(
          d.reason===
          q.keyReason
        );

    }else{

      state.scores[
        q.slots[0]
      ]=
        Number(
          q.type==="multi"
            ?d.selected.every(
              v=>
                q.key.includes(v)
            )
            :d.choice===q.key
        );
    }

    if(allAnswered()){
      Object.freeze(
        state.scores
      );
    }

  }else if(
    q.type==="multi"
  ){

    r.feedback=
      d.selected.filter(
        v=>q.key.includes(v)
      ).length;

  }else if(
    q.type==="single"
  ){

    r.feedback=
      d.choice===q.key
        ?2
        :d.choice===q.partial
          ?1
          :0;
  }

  render(
    "answerTitle"
  );

  announce(
    q.exam||
    q.type==="pair"
      ?"Response submitted."
      :"Feedback is available."
  );
}

function finishQuestion(){

  const id=
    state.page;

  const q=
    QUESTIONS[id];

  const r=
    state.answers[id];

  if(
    !q||
    !r.submitted||
    !canVisit(id)
  ){
    return;
  }

  if(
    q.exam&&
    id!==EXAM[
      state.examIndex
    ]
  ){
    return;
  }

  state.done.add(id);

  if(q.exam){

    state.examIndex++;

    go(
      EXAM[
        state.examIndex
      ]||
      "results"
    );

  }else{

    const b=
      branchFor(id);

    go(
      b.pages.indexOf(id)===0
        ?b.pages[1]
        :"hub"
    );
  }
}

function completeStatic(next){

  if(
    canVisit(
      state.page
    )
  ){
    state.done.add(
      state.page
    );

    go(next);
  }
}

function earnCompletion(){

  if(
    state.page!=="finish"||
    state.earned||
    !allBranchesDone()||
    !reviewComplete()||
    !state.done.has("results")
  ){
    return;
  }

  state.name=
    (
      $("certificateName")
        ?.value??
      state.name
    )
    .slice(0,70);

  state.date=
    new Intl.DateTimeFormat(
      undefined,
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    )
    .format(
      new Date()
    );

  state.earned=true;

  state.done.add(
    "finish"
  );

  $("printSheet").innerHTML=
    certificate();

  render();

  announce(
    "Lesson complete. Your certificate is ready."
  );
}

function primaryAction(){

  const id=
    state.page;

  const q=
    QUESTIONS[id];

  const r=
    state.answers[id];

  if(q){

    if(r.submitted){

      return {

        label:
          q.exam
            ?id==="s4"
              ?"Review answers"
              :"Next question"
            :q.type==="pair"
              ?"See what happens next"
              :"Return to checkpoints",

        enabled:true,

        run:
          finishQuestion
      };
    }

    if(
      q.type==="pair"&&
      r.phase===0
    ){

      return {

        label:
          q.exam
            ?"Continue to 2B · Reasoning"
            :"Choose a reason",

        enabled:
          Boolean(
            r.draft.action
          ),

        hint:
          r.draft.action
            ?""
            :"Choose one recommendation.",

        run:()=>{

          captureDraft();

          if(
            r.draft.action
          ){
            r.phase=1;
            render(
              "questionTitle"
            );
          }
        }
      };
    }

    const ready=
      valid(
        q,
        r.draft
      );

    return {

      label:
        q.type==="pair"
          ?"Submit both choices"
          :"Submit response",

      enabled:
        ready,

      run:
        submitAnswer,

      hint:
        q.type==="multi"
          ?`
            Select exactly two.
            ${
              (
                r.draft.selected||
                []
              ).length
            }
            selected.
          `
          :ready
            ?""
            :q.type==="match"
              ?"Choose an effect for each response."
              :"Choose one response."
    };
  }

  if(id==="hub"){

    return {

      label:
        "Continue to debrief",

      enabled:
        allBranchesDone(),

      run:()=>
        go("debrief"),

      hint:
        allBranchesDone()
          ?""
          :"Complete all three checkpoints to continue."
    };
  }

  if(id==="results"){

    const i=
      state.reviewPanel;

    const ready=
      reviewReady(i);

    const othersDone=
      i<3||
      [0,1,2].every(
        j=>state.reviewed.has(j)
      );

    return {

      label:
        reviewLabel(),

      enabled:
        ready&&othersDone,

      run:
        advanceReview,

      hint:
        !ready
          ?state.practiceVisible[i]
            ?"Complete the practice above to continue."
            :"Select Start practice in the question panel before continuing."
          :!othersDone
            ?"Complete the other question reviews using the numbered buttons above, then finish here."
            :i===3
              ?"Next: recap and certificate."
              :`Next: review Question ${i+2}.`
    };
  }

  if(id==="finish"){

    return {

      label:
        state.earned
          ?"Lesson complete"
          :"Finish lesson",

      enabled:
        !state.earned,

      run:
        earnCompletion
    };
  }

  const next={
    intro:"concept",
    concept:"model",
    model:"hub",
    debrief:
      state.examStarted
        ?"results"
        :"s1"
  }[id]||
  branchFor(id)?.pages[2];

  return {

    label:
      id==="model"
        ?"Choose a checkpoint"
        :id==="debrief"
          ?state.examStarted
            ?"Review answers"
            :"Start assessment"
          :"Continue",

    enabled:true,

    run:()=>
      completeStatic(next)
  };
}

  $("nextButton").textContent=

  $("nextButton").disabled=

  $("actionHint").textContent=
    action.hint||"";

  $("actionHint").hidden=
    !action.hint;

  if(action.hint){

    $("nextButton")
      .setAttribute(
        "aria-describedby",
        "actionHint"
      );

  }else{

    $("nextButton")
      .removeAttribute(
        "aria-describedby"
      );
  }

  const q=
    QUESTIONS[
      state.page
    ];

  const r=
    state.answers[
      state.page
    ];

  const phaseBack=
    q?.type==="pair"&&
    !r.submitted&&
    r.phase===1;

  $("backButton").textContent=
    state.page==="results"
      ?"Previous review"
      :phaseBack
        ?"Back to recommendation"
        :"Back";

  $("backButton").disabled=
    state.page==="results"
      ?state.reviewPanel===0
      :!phaseBack&&
        !previousPage();

  const reasonButton=
    document.querySelector(
      '[data-action="phase"][data-phase="1"]'
    );

  if(reasonButton){

    reasonButton.disabled=
      !r.draft.action;
  }

  if(
    $("checkPractice")
  ){

    $("checkPractice").disabled=
      !practiceReady();

    const slot=
      activePracticeSlot();

    const practice=
      state.practice[slot];

    $("practiceHint").textContent=
      practiceReady()
        ?"Select Check answer to see feedback."
        :practice.last
          ?"Use the feedback to choose another answer."
          :"Choose an answer, then select Check answer.";
  }

  $("hubButton").hidden=
    !state.done.has("model");

  $("hubButton").disabled=
    examLocked()||
    state.page==="hub";

  $("hubButton").title=
    examLocked()
      ?"Complete the assessment, reviews and required practice before returning to checkpoints."
      :"Choose or review a checkpoint";

  const b=
    branchFor(
      state.page
    );

  const bi=
    [
      "intro",
      "concept",
      "model"
    ]
    .indexOf(
      state.page
    );

  $("position").textContent=
    b
      ?`
        Checkpoint ${
          BRANCHES.indexOf(b)+1
        } ·
        Step ${
          b.pages.indexOf(
            state.page
          )+1
        } of 3
      `
      :q?.exam
        ?`
          Question ${
            EXAM.indexOf(
              state.page
            )+1
          } of 4
        `
        :state.page==="results"
          ?`
            Question ${
              state.reviewPanel+1
            } of 4 ·
            ${
              state.practiceVisible[
                state.reviewPanel
              ]
                ?"Practice"
                :"Review"
            }
          `
          :bi>=0
            ?`
              Briefing ${
                bi+1
              } of 3
            `
            :screen(
              state.page
            ).title;

  $("progress").max=
    SCREENS.length;

  $("progress").value=
    state.done.size;

  $("progress").textContent=
    `${state.done.size} of ${SCREENS.length} steps`;

  $("progressLabel").textContent=
    `Lesson progress: ${state.done.size} of ${SCREENS.length} steps`;
}

              s=>s.group===id
            );

          const open=
            state.openGroup===id;

          const done=
            pages.every(
              s=>state.done.has(s.id)
            );

          return `
            <section class="menu-group">

              <button
                class="menu-heading"
                data-group="${id}"
                aria-controls="group-${id}"
                aria-expanded="${open}"
              >

                <span>
                  ${esc(title)}
                </span>

                <span
                  aria-hidden="true"
                  style="flex:none"
                >
                  ${done?"✓ ":""}
                  ${open?"−":"+"}
                </span>

              </button>

              <ol
                id="group-${id}"
                ${open?"":"hidden"}
              >

                ${
                  pages
                    .map(
                      s=>{

                        const current=
                          s.id===
                          state.page;

                        const available=
                          canVisit(s.id);

                        const complete=
                          state.done.has(
                            s.id
                          );

                        const status=
                          current
                            ?"current screen"
                            :complete
                              ?"completed"
                              :available
                                ?"available"
                                :"not available yet";

                        return `
                          <li>

                            <button
                              class="menu-item"
                              data-page="${s.id}"
                              ${
                                available
                                  ?""
                                  :"disabled"
                              }
                              ${
                                current
                                  ?'aria-current="page"'
                                  :""
                              }
                              aria-label="${
                                esc(
                                  s.number+
                                  ". "+
                                  s.menuTitle+
                                  ", "+
                                  status
                                )
                              }"
                            >

                              <span
                                class="mark"
                                aria-hidden="true"
                              >
                                ${
                                  complete
                                    ?"✓"
                                    :current
                                      ?"›"
                                      :"·"
                                }
                              </span>

                              <span>
                                ${s.number}
                                ${esc(s.menuTitle)}
                              </span>

                            </button>

                          </li>
                        `;
                      }
                    )
                    .join("")
                }

              </ol>

            </section>
          `;
        }
      )
      .join("");
}

function render(
  focus="screenTitle"
){

  stopMedia();

  $("canvas")
    .classList
    .toggle(
      "welcome",
      state.page==="intro"
    );

  $("canvas").innerHTML=`
    <h1
      id="screenTitle"
      tabindex="-1"
    >
      ${esc(
        screen(
          state.page
        ).title
      )}
    </h1>

    <div
      id="lessonBody"
      class="screen-body"
    >
      ${content(state.page)}
    </div>
  `;

  renderMenu();
  renderControls();
  mountMedia();

  $("canvas").scrollTop=0;

  focusTo(focus);
}

function showDialog(
  title,
  html
){

  stopMedia();

  dialogFocus=
    document.activeElement;

  $("dialogTitle").textContent=
    title;

  $("dialogBody").innerHTML=
    html;

  $("dialog").showModal();

  $("dialog").scrollTop=0;

  $("closeDialog").focus();
}

$("nextButton")
  .addEventListener(
    "click",
    event=>{

      if(event.detail<=1){

        const a=
          primaryAction();

        if(a.enabled){
          a.run();
        }
      }
    }
  );

$("backButton")
  .addEventListener(
    "click",
    event=>{

      if(event.detail<=1){
        back();
      }
    }
  );

$("canvas")
  .addEventListener(
    "change",
    event=>{

      if(
        event.target.closest(
          "#responseForm"
        )
      ){
        captureDraft();
        renderControls();
      }

      const form=
        event.target.closest(
          "#practiceForm"
        );

      if(form){

        const slot=
          Number(
            form.dataset.slot
          );

        if(
          !state.practice[
            slot
          ].passed
        ){

          state.practice[
            slot
          ].choice=
            event.target.value;

          renderControls();
        }
      }
    }
  );

$("canvas")
  .addEventListener(
    "input",
    event=>{

      if(
        event.target.id===
        "certificateName"
      ){
        state.name=
          event.target.value;
      }
    }
  );

$("canvas")
  .addEventListener(
    "submit",
    event=>{

      event.preventDefault();

      if(
        event.target.id===
        "practiceForm"
      ){

        submitPractice();

      }else if(
        event.target.id===
        "responseForm"
      ){

        const a=
          primaryAction();

        if(a.enabled){
          a.run();
        }
      }
    }
  );

$("canvas")
  .addEventListener(
    "click",
    event=>{

      const button=
        event.target.closest(
          "button[data-action]"
        );

      if(
        !button||
        event.detail>1
      ){
        return;
      }

      switch(
        button.dataset.action
      ){

        case "branch":

          startBranch(
            button.dataset.branch
          );

          break;

        case "phase":{

          const r=
            state.answers[
              state.page
            ];

          const phase=
            Number(
              button.dataset.phase
            );

          if(
            !r||
            r.submitted
          ){
            return;
          }

          captureDraft();

          if(
            phase===0||
            (
              phase===1&&
              r.draft.action
            )
          ){
            r.phase=phase;
            render(
              "questionTitle"
            );
          }

          break;
        }

        case "report":{

          const reportKey=
            button.dataset.report;

          if(
            REPORTS[
              reportKey
            ]
          ){

            showDialog(
              reportKey.startsWith("practice")
                ?"Practice report"
                :"Mission report",
              report(
                reportKey,
                true
              )
            );
          }

          break;
        }

        case "review":

          selectReview(
            Number(
              button.dataset.panel
            )
          );

          break;

        case "practice-start":

          startPractice();

          break;

        case "practice-feedback":

          state.practiceVisible[
            state.reviewPanel
          ]=false;

          render(
            "reviewTitle"
          );

          break;

        case "practice-next":

          nextPractice();

          break;

        case "print":

          if(state.earned){
            window.print();
          }

          break;

        case "exit":

          if(state.earned){

            showDialog(
              "Lesson complete",
              p(
                "Print your certificate before closing this tab if you need a copy. You may now close the tab."
              )
            );
          }

          break;
      }
    }
  );

$("menuList")
  .addEventListener(
    "click",
    event=>{

      const group=
        event.target.closest(
          "button[data-group]"
        );

      if(group){

        state.openGroup=
          state.openGroup===
          group.dataset.group
            ?null
            :group.dataset.group;

        renderMenu();

        document.querySelector(
          `[data-group="${group.dataset.group}"]`
        )?.focus();

        return;
      }

      const page=
        event.target.closest(
          "button[data-page]"
        );

      if(
        page&&
        !page.disabled
      ){
        go(
          page.dataset.page
        );
      }
    }
  );

$("hubButton")
  .addEventListener(
    "click",
    ()=>go("hub")
  );

$("menuButton")
  .addEventListener(
    "click",
    ()=>{

      setMenu(
        $("menuButton")
          .getAttribute(
            "aria-expanded"
          )!=="true"
      );
    }
  );

$("readingButton")
  .addEventListener(
    "click",
    ()=>{

      setReading(
        $("readingButton")
          .getAttribute(
            "aria-pressed"
          )!=="true"
      );
    }
  );

$("textButton")
  .addEventListener(
    "click",
    ()=>{

      const clone=
        $("lessonBody")
          .cloneNode(true);

      clone
        .querySelectorAll(
          "details"
        )
        .forEach(
          el=>{
            el.open=true;
          }
        );

      clone
        .querySelectorAll(
          "audio,img,svg,button,.audio-caption"
        )
        .forEach(
          el=>{
            el.remove();
          }
        );

      const holder=
        document.createElement(
          "div"
        );

      holder.className=
        "sr-only";

      holder.setAttribute(
        "aria-hidden",
        "true"
      );

      holder.append(clone);

      document.body.append(
        holder
      );

      const text=
        clone.innerText;

      holder.remove();

      showDialog(
        screen(
          state.page
        ).title,
        `<div class="screen-text">${esc(text)}</div>`
      );
    }
  );

          </h3>

$("closeDialog")
  .addEventListener(
    "click",
    ()=>{
      $("dialog").close();
    }
  );

$("dialog")
  .addEventListener(
    "close",
    ()=>{

      if(
        dialogFocus?.isConnected
      ){
        dialogFocus.focus();
      }
    }
  );

$("brandLogo").src=
  LOGO;

const narrow=
  matchMedia(
    "(max-width:900px)"
  );

setReading(
  narrow.matches
);

setMenu(
  !narrow.matches
);

$("readingButton").hidden=
  narrow.matches;

narrow.addEventListener(
  "change",
  event=>{

    $("readingButton").hidden=
      event.matches;

    if(event.matches){

      setReading(true);
      setMenu(false);
    }
  }
);

render();

</script>

</body>
</html>
